version: '3.8'

services:
  hungryman-authentication-database:
    image: postgres:15-alpine
    container_name: authentication-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: auth
    ports:
      - "5433:5433"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - hungryman-network

  hungryman-authentication-service:
    image: authentication-service
    container_name: authentication-service
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=authentication-db;Port=5433;Database=auth;Username=postgres;Password=postgrespassword
    ports:
      - "8080:8080"
    depends_on:
      - hungryman-authentication-database
    networks:
      - hungryman-network

volumes:
  auth-db-data:

networks:
  hungryman-network:
    driver: bridge
