apiVersion: apps/v1
kind: Deployment
metadata:
  name: hungryman-authentication-service
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: authentication-service
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
