apiVersion: apps/v1
kind: Deployment
metadata:
  name: hungryman-api-gateway
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: hungryman-api-gateway
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
