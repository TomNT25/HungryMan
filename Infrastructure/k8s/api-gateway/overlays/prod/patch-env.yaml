apiVersion: apps/v1
kind: Deployment
metadata:
  name: hungryman-api-gateway
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: hungryman-api-gateway
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
