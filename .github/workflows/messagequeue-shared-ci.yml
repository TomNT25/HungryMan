name: MessageQueue Shared CI

on:
  push:
    branches:
      - main
      - develop
      - "hungryman/**"
    paths:
      - "Backend/MessageQueue-Shared/**"
      - "Backend/Shared/**"
      - ".github/workflows/messagequeue-shared-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "Backend/MessageQueue-Shared/**"
      - "Backend/Shared/**"
      - ".github/workflows/messagequeue-shared-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Backend/MessageQueue-Shared/MessageQueue-Shared.csproj

      - name: Build
        run: dotnet build Backend/MessageQueue-Shared/MessageQueue-Shared.csproj --no-restore --configuration Release
